<div class="list-group-item review-item" data-review="{{ review.id }}">
    <div class="d-flex justify-content-between align-items-center">
        <strong>{{ review.user.username }}</strong>
        <span class="text-secondary small">{{ review.created_at|date:"d.m.Y H:i" }}</span>
    </div>
    <p class="mt-2 mb-2">{{ review.text|linebreaksbr }}</p>
    {% if review.user_id == user.id or user.is_staff %}
        <button type="button" class="btn btn-sm btn-outline-danger"
                data-delete-review="{{ review.id }}"
                data-url="/reviews/{{ review.id }}/delete/">Удалить</button>
    {% endif %}
</div>
